<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a flagged region goes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · AOI-Agent</p>
    <h1>Where a flagged region goes</h1>

    <svg viewBox="0 0 1024 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-diagram-title architecture-diagram-desc">
      <title id="architecture-diagram-title">Where a flagged region goes</title>
      <desc id="architecture-diagram-desc">Architecture of the AOI-Agent PCB re-verification pipeline: board images enter a template-differencing simulator, a ResNet-18 re-verifier auto-resolves most flagged regions, an MCP-tool and local-LLM agent layer weighs the rest, and anything it cannot settle suspends to a human review station whose recorded decisions feed the next training round.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONES (painted first) ============ -->
      <rect x="400" y="176" width="240" height="216" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="484" y="180" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="189" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VISION</text>

      <rect x="400" y="408" width="564" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="644" y="412" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="421" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AGENT</text>

      <rect x="76" y="408" width="240" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="152" y="412" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="421" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ESCALATION</text>

      <!-- ============ ARROWS (before boxes) ============ -->

      <!-- A1  Board -> AOI simulator -->
      <line x1="520" y1="168" x2="520" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A2  AOI simulator -> Re-verifier -->
      <line x1="520" y1="272" x2="520" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="530" y="284" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="293" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANDIDATE</text>

      <!-- A3  Re-verifier -> Auto-resolved -->
      <line x1="620" y1="344" x2="744" y2="344" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="648" y="326" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="690" y="335" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISMISS ≥.961</text>

      <!-- A4  Re-verifier -> MCP tools -->
      <line x1="520" y1="376" x2="520" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="530" y="414" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="423" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ELSE</text>

      <!-- A5  MCP tools -> Local LLM -->
      <line x1="620" y1="472" x2="744" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="650" y="454" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="463" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVIDENCE</text>

      <!-- A6  MCP tools -> Suspended state  (escalate) -->
      <line x1="420" y1="472" x2="296" y2="472" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="320" y="454" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="358" y="463" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INTERRUPT()</text>

      <!-- A7  Local LLM -> Decision record -->
      <path d="M 844,504 V 528 Q 844,536 836,536 H 528 Q 520,536 520,544 V 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="650" y="518" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="527" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>

      <!-- A8  Suspended state -> Review station -->
      <line x1="196" y1="504" x2="196" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="206" y="530" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="230" y="539" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUEUE</text>

      <!-- A9  Review station -> Decision record -->
      <line x1="296" y1="600" x2="420" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="326" y="582" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="358" y="591" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DECISION</text>

      <!-- A10  Decision record -> Re-verifier  (feedback, dashed) -->
      <path d="M 520,632 V 672 Q 520,680 512,680 H 56 Q 48,680 48,672 V 352 Q 48,344 56,344 H 420"
            fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="248" y="662" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="671" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRAIN</text>

      <!-- ============ NODES ============ -->

      <!-- N1  Board + Template -->
      <rect x="420" y="104" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="104" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="428" y="110" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="442" y="119" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="520" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Board + Golden Template</text>
      <text x="520" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DeepPCB · official split</text>

      <!-- N2  AOI Simulator -->
      <rect x="420" y="208" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="208" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="428" y="214" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="442" y="223" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CV</text>
      <text x="520" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AOI Simulator</text>
      <text x="520" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">template differencing</text>

      <!-- N3  Re-verifier  (FOCAL) -->
      <rect x="420" y="312" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="312" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="428" y="318" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="442" y="327" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ML</text>
      <text x="520" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Re-verifier</text>
      <text x="520" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ResNet-18 · 3×64×64</text>

      <!-- N4  Auto-resolved -->
      <rect x="744" y="312" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="312" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="752" y="318" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="766" y="327" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="844" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Never Reaches a Person</text>
      <text x="844" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">52.8% of the queue</text>

      <!-- N5  MCP Tools -->
      <rect x="420" y="440" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="440" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="428" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="442" y="455" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="520" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP Tool Servers</text>
      <text x="520" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">typed params · guarded SQL</text>

      <!-- N6  Local LLM -->
      <rect x="744" y="440" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="440" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="752" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="766" y="455" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="844" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local Reasoner</text>
      <text x="844" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpt-oss:20b · Ollama</text>

      <!-- N8  Suspended state -->
      <rect x="96" y="440" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="440" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="104" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="118" y="455" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="196" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Suspended Run</text>
      <text x="196" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checkpoints + escalations</text>

      <!-- N7  Review station  (FOCAL) -->
      <rect x="96" y="568" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="568" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="104" y="574" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="118" y="583" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HMI</text>
      <text x="196" y="602" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review Station</text>
      <text x="196" y="618" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every failure lands here</text>

      <!-- N9  Decision record -->
      <rect x="420" y="568" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="568" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="428" y="574" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="442" y="583" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="520" y="602" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decision Record</text>
      <text x="520" y="618" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">review_decisions</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="716" x2="984" y2="716" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="736" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="728" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="160" y="737" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>

      <rect x="300" y="728" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="737" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROCESS</text>

      <rect x="460" y="728" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="737" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STORE</text>

      <rect x="620" y="728" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="640" y="737" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTERNAL</text>

      <line x1="780" y1="734" x2="792" y2="734" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="737" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FEEDBACK</text>
    </svg>
  </div>
</body>
</html>
