<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 776" width="960" height="776" role="img" aria-labelledby="disposition-dark-title disposition-dark-desc" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="disposition-dark-title">How one flagged region is dispositioned</title>
<desc id="disposition-dark-desc">Flowchart: the re-verifier classifies a flagged region; a confident false call is dismissed and a confident defect confirmed without a language model; anything else gathers production context and criteria, the LLM writes a rationale, and the region is decided on the classifier's confidence or handed to an operator through a durable interrupt.</desc>
<defs><marker id="disposition-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="disposition-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs>
<rect x="0" y="0" width="960" height="776" fill="#2d3142"/>
<path d="M480,72 V108" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#disposition-dark-arrow)"/>
<path d="M480,176 V208" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#disposition-dark-arrow)"/>
<path d="M384,248 H144 Q136,248 136,256 V652 Q136,660 144,660 H356" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#disposition-dark-arrow)"/>
<rect x="160" y="224" width="200" height="14" rx="2" fill="#2d3142"/><text x="260" y="235" fill="#8e98ac" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">P(FALSE CALL) ≥ 0.961 · DISMISS</text>
<path d="M576,248 H912 Q920,248 920,256 V652 Q920,660 912,660 H604" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#disposition-dark-arrow)"/>
<rect x="635" y="224" width="219" height="14" rx="2" fill="#2d3142"/><text x="744" y="235" fill="#8e98ac" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">DEFECT ≥ 0.996, NOT OPEN · CONFIRM</text>
<path d="M480,288 V316" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#disposition-dark-arrow)"/>
<rect x="488" y="295" width="101" height="14" rx="2" fill="#2d3142"/><text x="492" y="306" fill="#8e98ac" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.06em">EVERYTHING ELSE</text>
<path d="M480,380 V404" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#disposition-dark-arrow)"/>
<path d="M480,468 V508" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#disposition-dark-arrow)"/>
<path d="M480,588 V628" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#disposition-dark-arrow)"/>
<rect x="488" y="601" width="175" height="14" rx="2" fill="#2d3142"/><text x="492" y="612" fill="#8e98ac" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.06em">CONFIDENCE ≥ 0.961 · DECIDE</text>
<path d="M576,548 H668" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#disposition-dark-arrow-accent)"/>
<rect x="568" y="524" width="107" height="14" rx="2" fill="#2d3142"/><text x="622" y="535" fill="#8e98ac" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">BELOW · ESCALATE</text>
<rect x="400" y="24" width="160" height="48" rx="24" fill="#2d3142"/><rect x="400" y="24" width="160" height="48" rx="24" fill="rgba(191,192,192,0.12)" stroke="#8e98ac" stroke-width="1"/><text x="480" y="44" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">AOI candidate</text><text x="480" y="60" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">template · test · difference</text>
<rect x="352" y="112" width="256" height="64" rx="6" fill="#2d3142"/><rect x="352" y="112" width="256" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><rect x="360" y="118" width="48" height="12" rx="2" fill="transparent" stroke="#f5f5f5" stroke-opacity="0.4" stroke-width="0.8"/><text x="384" y="127" fill="#f5f5f5" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLASSIFY</text><text x="480" y="144" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">ResNet-18 re-verifier</text><text x="480" y="160" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">class + P(false call) · 2.5 ms CPU</text>
<polygon points="480,208 576,248 480,288 384,248" fill="#2d3142"/><polygon points="480,208 576,248 480,288 384,248" fill="#393e53" stroke="#f5f5f5" stroke-width="1" stroke-linejoin="round"/><text x="480" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">sure enough?</text>
<rect x="352" y="316" width="256" height="64" rx="6" fill="#2d3142"/><rect x="352" y="316" width="256" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><rect x="360" y="322" width="33" height="12" rx="2" fill="transparent" stroke="#f5f5f5" stroke-opacity="0.4" stroke-width="0.8"/><text x="376" y="331" fill="#f5f5f5" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text><text x="480" y="348" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">gather context</text><text x="480" y="364" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">3 MCP tools · criteria scoped by class</text>
<rect x="352" y="404" width="256" height="64" rx="6" fill="#2d3142"/><rect x="352" y="404" width="256" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><rect x="360" y="410" width="23" height="12" rx="2" fill="transparent" stroke="#f5f5f5" stroke-opacity="0.4" stroke-width="0.8"/><text x="372" y="419" fill="#f5f5f5" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text><text x="480" y="436" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">LLM writes the rationale</text><text x="480" y="452" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">explains, never decides · 60 s limit</text>
<polygon points="480,508 576,548 480,588 384,548" fill="#2d3142"/><polygon points="480,508 576,548 480,588 384,548" fill="#393e53" stroke="#f5f5f5" stroke-width="1" stroke-linejoin="round"/><text x="480" y="552" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">sure enough?</text>
<rect x="360" y="632" width="240" height="56" rx="24" fill="#2d3142"/><rect x="360" y="632" width="240" height="56" rx="24" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="480" y="656" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">classifier's verdict stands</text><text x="480" y="672" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">dismiss · confirm · decide</text>
<rect x="672" y="516" width="224" height="64" rx="6" fill="#2d3142"/><rect x="672" y="516" width="224" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><rect x="680" y="522" width="33" height="12" rx="2" fill="transparent" stroke="#f08a59" stroke-opacity="0.4" stroke-width="0.8"/><text x="696" y="531" fill="#f08a59" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text><text x="784" y="548" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">an operator answers</text><text x="784" y="564" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">interrupt() · checkpoint · queue</text>
