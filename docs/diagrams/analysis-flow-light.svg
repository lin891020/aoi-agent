<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 992 488" width="992" height="488" role="img" aria-labelledby="analysis-light-title analysis-light-desc" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="analysis-light-title">How /ask answers a supervisor's question</title>
<desc id="analysis-light-desc">Data-flow: a supervisor's question becomes a typed plan of tool calls from one LLM call; the plan is validated against real tool signatures and the store's value domains and refused with every error if it fails; valid calls fan out in parallel, results are collected with a chart derived from their shape, a second LLM call writes prose beside the figures, and the run is stored so a chart is redrawn from data rather than by re-planning.</desc>
