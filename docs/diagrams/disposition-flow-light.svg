<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 776" width="960" height="776" role="img" aria-labelledby="disposition-light-title disposition-light-desc" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="disposition-light-title">How one flagged region is dispositioned</title>
<desc id="disposition-light-desc">Flowchart: the re-verifier classifies a flagged region; a confident false call is dismissed and a confident defect confirmed without a language model; anything else gathers production context and criteria, the LLM writes a rationale, and the region is decided on the classifier's confidence or handed to an operator through a durable interrupt.</desc>
<defs><marker id="disposition-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="disposition-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
<rect x="0" y="0" width="960" height="776" fill="#f5f5f5"/>
<path d="M480,72 V108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#disposition-light-arrow)"/>
<path d="M480,176 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#disposition-light-arrow)"/>
<path d="M384,248 H144 Q136,248 136,256 V652 Q136,660 144,660 H356" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#disposition-light-arrow)"/>
<rect x="160" y="224" width="200" height="14" rx="2" fill="#f5f5f5"/><text x="260" y="235" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle" letter-spacing="0.06em">P(FALSE CALL) ≥ 0.912 · DISMISS</text>
<path d="M576,248 H912 Q920,248 920,256 V652 Q920,660 912,660 H604" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#disposition-light-arrow)"/>
<rect x="635" y="224" width="219" height="14" rx="2" fill="#f5f5f5"/><text x="744" y="235" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle" letter-spacing="0.06em">DEFECT ≥ 0.947, NOT OPEN · CONFIRM</text>
<path d="M480,288 V316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#disposition-light-arrow)"/>
<rect x="488" y="295" width="101" height="14" rx="2" fill="#f5f5f5"/><text x="492" y="306" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="start" letter-spacing="0.06em">EVERYTHING ELSE</text>
<path d="M480,380 V404" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#disposition-light-arrow)"/>
<path d="M480,468 V508" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#disposition-light-arrow)"/>
<path d="M480,588 V628" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#disposition-light-arrow)"/>
<rect x="488" y="601" width="175" height="14" rx="2" fill="#f5f5f5"/><text x="492" y="612" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="start" letter-spacing="0.06em">CONFIDENCE ≥ 0.912 · DECIDE</text>
<path d="M576,548 H668" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#disposition-light-arrow-accent)"/>
