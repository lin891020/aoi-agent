<rect x="400" y="24" width="160" height="48" rx="24" fill="#f5f5f5"/><rect x="400" y="24" width="160" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="480" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">AOI candidate</text><text x="480" y="60" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle">template · test · difference</text>
<rect x="352" y="112" width="256" height="64" rx="6" fill="#f5f5f5"/><rect x="352" y="112" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="360" y="118" width="48" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="384" y="127" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle" letter-spacing="0.08em">CLASSIFY</text><text x="480" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">ResNet-18 re-verifier</text><text x="480" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle">class + P(false call) · 2.5 ms CPU</text>
<polygon points="480,208 576,248 480,288 384,248" fill="#f5f5f5"/><polygon points="480,208 576,248 480,288 384,248" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-linejoin="round"/><text x="480" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">route on confidence</text>
<rect x="352" y="316" width="256" height="64" rx="6" fill="#f5f5f5"/><rect x="352" y="316" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="360" y="322" width="33" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="376" y="331" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text><text x="480" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">gather context</text><text x="480" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle">3 MCP tools · criteria scoped to the class</text>
<rect x="352" y="404" width="256" height="64" rx="6" fill="#f5f5f5"/><rect x="352" y="404" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="360" y="410" width="23" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="372" y="419" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text><text x="480" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">LLM rationale</text><text x="480" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle">explanation only · 60 s deadline</text>
<polygon points="480,508 576,548 480,588 384,548" fill="#f5f5f5"/><polygon points="480,508 576,548 480,588 384,548" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-linejoin="round"/><text x="480" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">route on confidence</text>
<rect x="360" y="632" width="240" height="56" rx="24" fill="#f5f5f5"/><rect x="360" y="632" width="240" height="56" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="656" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">disposition = classifier's class</text><text x="480" y="672" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle">dismiss · confirm · decide</text>
<rect x="672" y="516" width="224" height="64" rx="6" fill="#f5f5f5"/><rect x="672" y="516" width="224" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><rect x="680" y="522" width="33" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="696" y="531" fill="#eb6c36" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text><text x="784" y="548" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">operator review</text><text x="784" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Noto Sans TC', monospace" text-anchor="middle">interrupt() · checkpoint · queue</text>
<text x="672" y="604" fill="#4f5d75" font-size="12" font-style="italic" font-family="Georgia, 'Times New Roman', serif" text-anchor="start">82.2% of regions are dispositioned without the LLM.</text>
<text x="672" y="620" fill="#4f5d75" font-size="12" font-style="italic" font-family="Georgia, 'Times New Roman', serif" text-anchor="start">The operator's answer is the next training label.</text>
