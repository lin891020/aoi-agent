[project]
name = "aoi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.1",
    "mcp[cli]>=2.0.0",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.17.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.129",
]

[project.scripts]
aoi-agent = "aoi_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `scripts` is here so tests can import the eval scripts by bare name. It puts
# every scripts/*.py on the import path under its own filename: nothing collides
# today, but `scripts/report.py` is the one to watch -- it is generic enough that
# a dependency could plausibly ship a top-level `report` and shadow either way.
pythonpath = ["src", "tests", "scripts"]
markers = [
    "dataset: requires DeepPCB to be cloned into data/DeepPCB",
]

[tool.ruff]
# The suppressions came first: 246 `# noqa` comments, each with a written
# reason, were in the tree before any linter was configured to act on them.
# `select` below is chosen so those comments mean something -- E402 and F811
# in the tests, BLE001 at the boundaries that must not raise -- rather than
# reading as unused directives.
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",       # pyflakes: unused imports/variables, undefined names
    "E4", "E7", "E9",  # pycodestyle errors worth failing on
    "E402",    # import not at top of file -- 188 noqa comments cite this by name
    "I",       # import sorting
    "BLE",     # blind `except Exception` -- 5 noqa comments already cite this
    "DTZ",     # naive datetime: results that differ by machine timezone
    "PLW1510", # subprocess.run without `check=` -- failures pass silently
    "RUF100",  # a `# noqa` that no longer suppresses anything
]
# Line length is not enforced: the prose in this codebase's comments is the
# point of it, and reflowing to 88 columns would fight the docstrings.
ignore = ["E501"]

# Deliberately no per-file-ignores for E402/F811. Blanket-ignoring them in
# tests would turn all 227 of the `# noqa` comments that cite them into unused
# directives, which is the opposite of the point: each of those comments says
# why that one line is exempt. A rule silenced per-line stays visible; a rule
# silenced per-directory disappears.

[dependency-groups]
dev = [
    "onnx>=1.20.0",
    "pytest>=9.1.1",
]

# torch's linux wheels drag the whole CUDA stack in as hard dependencies --
# cudnn, nccl, triton, the lot, several GB of it. Nothing here has ever seen a
# GPU that is not Apple's, so linux resolves against PyTorch's CPU index
# instead. The marker keeps macOS on PyPI, where the wheel is CPU-only anyway
# and MPS still works.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
